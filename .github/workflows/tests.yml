name: tests
on:
  push:
  pull_request:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test tools
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          npm install --no-save peer@1.0.2
      - name: Start servers
        run: |
          node -e "require('peer').PeerServer({port:9000,path:'/',host:'127.0.0.1'})" &
          python -m http.server 8766 &
          python tests/mock_supabase.py 8790 &
          sleep 3
      - name: One phone game
        run: python tests/e2e.py
      - name: Practice mode
        run: python tests/e2e_practice.py
      - name: Four phones
        run: python tests/e2e_multi.py
      - name: Time limits and deadlines
        run: python tests/e2e_time.py
      - name: Practice never freezes
        run: python tests/e2e_fuzz.py
      - name: Scribbles score zero
        run: python tests/e2e_scoring.py
      - name: Daily challenge, levels and rankings
        run: python tests/e2e_challenges.py
      - name: Guided drawings
        run: python tests/e2e_guided.py
      - name: Live ranking database is reachable and protected
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' js/config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' js/config.js)
          curl -fsS "$URL/rest/v1/leaderboard?select=player,score&limit=1" -H "apikey: $KEY"; echo
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/scores?select=device&limit=1" -H "apikey: $KEY"); echo "read device ids -> $code"; test "$code" != "200"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/scores" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"board":"levels","device":"00000000-0000-4000-8000-000000000000","player":"x","score":100}'); echo "direct insert -> $code"; test "$code" != "201"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/submit_score" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_board":"levels","p_device":"00000000-0000-4000-8000-000000000000","p_player":" ","p_score":0}'); echo "invalid submit -> $code"; test "$code" = "400"
