name: tests
on:
  push:
  pull_request:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test tools
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          npm install --no-save peer@1.0.2
      - name: Start servers
        run: |
          node -e "require('peer').PeerServer({port:9000,path:'/',host:'127.0.0.1'})" &
          python -m http.server 8766 &
          sleep 3
      - name: One phone game
        run: python tests/e2e.py
      - name: Practice mode
        run: python tests/e2e_practice.py
      - name: Four phones
        run: python tests/e2e_multi.py
      - name: Time limits and deadlines
        run: python tests/e2e_time.py
