name: tests
on:
  push:
  pull_request:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test tools
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          npm install --no-save peer@1.0.2
      - name: Start servers
        run: |
          node -e "require('peer').PeerServer({port:9000,path:'/',host:'127.0.0.1'})" &
          python -m http.server 8766 &
          python tests/mock_supabase.py 8790 &
          sleep 3
      - name: One phone game
        run: bash tests/ci_run.sh tests/e2e.py
      - name: Practice mode
        run: bash tests/ci_run.sh tests/e2e_practice.py
      - name: Four phones
        run: bash tests/ci_run.sh tests/e2e_multi.py
      - name: Time limits and deadlines
        run: bash tests/ci_run.sh tests/e2e_time.py
      - name: Practice never freezes
        run: bash tests/ci_run.sh tests/e2e_fuzz.py
      - name: Scribbles score zero
        run: bash tests/ci_run.sh tests/e2e_scoring.py
      - name: Daily challenge, levels and rankings
        run: bash tests/ci_run.sh tests/e2e_challenges.py
      - name: Guided drawings
        run: bash tests/ci_run.sh tests/e2e_guided.py
      - name: Drawing sharing and clinician dashboard
        run: bash tests/ci_run.sh tests/e2e_cloud.py
      - name: AI explanations, feedback and offline app
        run: bash tests/ci_run.sh tests/e2e_extras.py
      - name: Spanish version
        run: bash tests/ci_run.sh tests/e2e_es.py
      - name: Browser back and forward buttons
        run: bash tests/ci_run.sh tests/e2e_nav.py
      - name: Tutorial, levels, achievements and sharing
        run: bash tests/ci_run.sh tests/e2e_game.py
      - name: Eight phones join a room through the live relay
        run: bash tests/ci_run.sh tests/e2e_relay.py
      - name: Live database is reachable and protected
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' js/config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' js/config.js)
          curl -fsS "$URL/rest/v1/leaderboard?select=player,score&limit=1" -H "apikey: $KEY"; echo
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/scores?select=device&limit=1" -H "apikey: $KEY"); echo "read device ids -> $code"; test "$code" != "200"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/scores" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"board":"levels","device":"00000000-0000-4000-8000-000000000000","player":"x","score":100}'); echo "direct insert -> $code"; test "$code" != "201"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/submit_score" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_board":"levels","p_device":"00000000-0000-4000-8000-000000000000","p_player":" ","p_score":0}'); echo "invalid submit -> $code"; test "$code" = "400"
          for t in drawings clinics clinic_patients clinic_sessions feedback; do code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/$t?select=*&limit=1" -H "apikey: $KEY"); echo "read $t -> $code"; test "$code" != "200"; done
          curl -fsS -X POST "$URL/rest/v1/rpc/donation_stats" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'; echo
          curl -fsS -X POST "$URL/rest/v1/rpc/feedback_summary" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'; echo
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/clinic_report" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_code":"ZZZZZZ","p_key":"wrong"}'); echo "clinic report with wrong key -> $code"; test "$code" = "400"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/donate_drawing" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_device":"00000000-0000-4000-8000-000000000000","p_word":"not an object","p_strokes":[[[1,2],[3,4]]],"p_ctrl":"look","p_guess":"x","p_score":1}'); echo "donate unknown object -> $code"; test "$code" = "400"
